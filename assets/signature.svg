<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-30 -30 3740 1615" role="img"
    aria-label="Levon Malkhasian signature" xmlns="http://www.w3.org/2000/svg">
  <style><![CDATA[
    /* The "pen" stroke that reveals the glyphs. These rules live here rather
       than in src/styles.css because this file is loaded as an <img>, which
       renders in its own document and cannot see the page's stylesheet or
       custom properties. */
    .sig-pen {
      fill: none;
      stroke: #ffffff;
      /* Wide enough to cover every glyph stroke it passes over. Measured: at 340 the
         pen missed 3.8% of the glyph pixels (the tips of the M's peaks stayed dark);
         500 covers 100% with the letter sequencing still reading one at a time. */
      stroke-width: 500;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* pathLength="1" on the element normalises the path to 1 unit, so these are
         fractions rather than px. If a browser ever ignores pathLength the stroke
         would render as a hairline dotted line — the fix is to swap both values for
         the pen path's real length, which measures 14513 user units. */
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: sig-write 7.5s ease-in-out infinite;
    }

    @keyframes sig-write {
      0%   { stroke-dashoffset: 1; opacity: 1; }
      45%,
      86%  { stroke-dashoffset: 0; opacity: 1; }
      96%,
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Motion-sensitive visitors get the finished signature, no writing */
    @media (prefers-reduced-motion: reduce) {
      .sig-pen {
        animation: none;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  ]]></style>
